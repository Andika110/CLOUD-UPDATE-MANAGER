# fly.toml app configuration file generated for Quinos Cloud Update Manager
app = "quinos-cloud-update"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/app/data/quinos_cloud.db"
  STORAGE_PATH = "/app/data/packages"
  HTML_PATH = "/app/web/index.html"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "quinos_data"
  destination = "/app/data"
  initial_size = "3gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
