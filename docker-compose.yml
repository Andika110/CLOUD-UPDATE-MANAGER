version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: quinos-cloud-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/packages:/var/quinos/packages:ro
      - certs-data:/etc/letsencrypt
    depends_on:
      - cloud-server

  cloud-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quinos-cloud-server
    restart: always
    environment:
      - PORT=8080
      - DB_PATH=/app/data/quinos_cloud.db
      - STORAGE_PATH=/app/data/packages
      - HTML_PATH=/app/web/index.html
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"

volumes:
  certs-data:
